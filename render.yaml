# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Secrets marked sync:false are asked for during setup.
services:
  - type: web
    name: carlson-bot
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: TWITCH_REFRESH_TOKEN
        sync: false
      - key: TWITCH_CHANNEL
        sync: false
